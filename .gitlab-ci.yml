---
###############################################################
# Requirements:                                               #
#   define the following gitlab CI secrets:                   #
#     AWS_DEFAULT_REGION                                      #
#     AWS_ACCESS_KEY_ID                                       #
#     AWS_SECRET_ACCESS_KEY                                   #
#     KUBERNETES_CLUSTER                                      #
#   and any other secrets to be used in HELM_ADDITIONAL_OPTS  #
###############################################################
image:
  name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5
  entrypoint:
      - "/usr/bin/env"
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

stages:
  - code-quality
  - pre-deploy
  - deploy

markdown_lint:
  stage: code-quality
  #tags:
  #  - linux
  image: pipelinecomponents/markdownlint:6ff4ccf
  script:
    - mdl --style all --warnings .

yaml_lint:
  stage: code-quality
  allow_failure: true
  #tags:
  #  - linux
  image:
    name: cytopia/yamllint:1.20
    entrypoint:
      - env
  script:
    - yamllint .gitlab-ci.yml

helm_lint:
  stage: code-quality
  image:
    name: lachlanevenson/k8s-helm:v3.2.4
    entrypoint: [""]
  script:
    - helm lint helm/

pre_deploy_development:
  stage: pre-deploy
  image: devth/helm:v3.2.4
  environment:
    name: development
  variables:
    APP_NAME: "sample-app"
    KUBERNETES_NAMESPACE: "sample"
  before_script:
    - apk add py-pip --update
    - pip install awscli
    - aws eks --region ${AWS_DEFAULT_REGION} update-kubeconfig
      --name ${KUBERNETES_CLUSTER}
  script:
    - helm upgrade --install ${APP_NAME} --namespace ${KUBERNETES_NAMESPACE}
      helm/ --values helm/config/values-${CI_ENVIRONMENT_NAME}.yaml --dry-run

deploy_development:
  stage: deploy
  image: devth/helm:v3.2.4
  environment:
    name: development
  when: manual
  variables:
    APP_NAME: "sample-app"
    KUBERNETES_NAMESPACE: "sample"
  before_script:
    - apk add py-pip --update
    - pip install awscli
    - aws eks --region ${AWS_DEFAULT_REGION} update-kubeconfig
      --name lumi-testlab-eks
  script:
    - |
      if [ ${REMOVE} ]
      then
        helm uninstall ${APP_NAME} --namespace ${KUBERNETES_NAMESPACE}
      fi
    - cat helm/config/values-${CI_ENVIRONMENT_NAME}.yaml
    - helm upgrade --install ${APP_NAME} --namespace ${KUBERNETES_NAMESPACE}
      helm/ --values helm/config/values-${CI_ENVIRONMENT_NAME}.yaml

deploy_local:
  stage: deploy
  image: devth/helm:v3.2.4
  environment:
    name: local
  when: manual
  variables:
    APP_NAME: "sample-app"
    KUBERNETES_NAMESPACE: "sample"
  before_script:
    - apk add py-pip --update
    - pip install awscli
    - aws eks --region ${AWS_DEFAULT_REGION} update-kubeconfig
      --name lumi-local-eks
  script:
    - |
      if [ ${REMOVE} ]
      then
        helm uninstall ${APP_NAME} --namespace ${KUBERNETES_NAMESPACE}
      fi
    - cat helm/config/values-${CI_ENVIRONMENT_NAME}.yaml
    - helm upgrade --install ${APP_NAME} --namespace ${KUBERNETES_NAMESPACE}
      helm/ --values helm/config/values-${CI_ENVIRONMENT_NAME}.yaml
