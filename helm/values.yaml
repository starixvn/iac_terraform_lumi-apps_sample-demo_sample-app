---
container:
  image: "nginxdemos/hello"
  tag: "latest"
  port: 80
  replicas: 1
  volume: 
    name: "volume-sample-app"
    mountPath: "/tmp"
  pvClaim: 
    name: "sample-claim"
    size: 1Gi
  


ingress:
  lbGroup: sample-app
  securityGroup: sg-default
  host: echo.luminetsoft.com
  path: /
  serviceName: sample-app
  servicePort: 80
