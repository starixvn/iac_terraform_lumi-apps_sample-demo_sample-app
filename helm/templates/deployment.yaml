---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  replicas: {{ .Values.container.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: {{ .Values.container.image }}:{{ .Values.container.tag }}
        imagePullPolicy: "IfNotPresent"
        ports:
        - containerPort: {{ .Values.container.port }}
        volumeMounts:
        - name: {{ .Values.container.volume.name }}
          mountPath: {{ .Values.container.volume.mountPath }}
      volumes:
      - name: {{ .Values.container.volume.name }}
        persistentVolumeClaim:
          claimName: {{ .Values.container.pvClaim.name }}
